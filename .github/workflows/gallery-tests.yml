name: Gallery tests
on:
  pull_request:
  push:
    branches: [main, feature/photo-gallery-codex]
permissions:
  contents: read
jobs:
  gallery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          for file in *.js tests/*.cjs; do node --check "$file"; done
      - name: Check booking phase one integration
        run: node tests/booking.test.cjs
      - name: Check photo editor integration
        run: node tests/photo-editor.test.cjs
      - name: Run behavior checks
        run: node tests/gallery.unit.test.cjs
      - name: Install browser test tools
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile browser checks
        run: node tests/gallery.test.cjs
